[project]
name = "anomaly-replication"
version = "0.1.0"
description = "Replication and post-publication decay of cross-sectional US equity anomalies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "databento>=0.90.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
